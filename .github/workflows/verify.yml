name: Verify v2 domain

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  domain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
